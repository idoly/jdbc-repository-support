name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
        profile: [boot40-min, boot40, boot41]
    name: Java ${{ matrix.java }} / ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: bash ./mvnw --batch-mode --no-transfer-progress -P${{ matrix.profile }} clean verify
